name: Materialize optimizer source
on:
  push:
    branches: ["feature/smart-charging-optimizer"]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize application source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-charging-optimizer
      - name: Reconstruct and commit source
        run: |
          rm -rf working-source
          cat source/chunk_*.b64 | tr -d '\n\r' | base64 -d > /tmp/source.zip
          mkdir working-source
          unzip -q /tmp/source.zip -d working-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working-source
          git commit -m "chore: materialize application source for optimizer development"
          git push origin HEAD:feature/smart-charging-optimizer
