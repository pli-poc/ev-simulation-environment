name: Deploy EV Energy Twin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and extract application source
        run: |
          cat source/chunk_*.b64 | tr -d '\n\r' | base64 -d > source-bundle.zip
          rm -rf site
          mkdir site
          unzip -q source-bundle.zip -d site
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("site/tsconfig.json")
          d = json.loads(p.read_text())
          d["compilerOptions"]["types"] = ["node"]
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /ev-simulation-environment
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
